global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    -   job_name: 'cadvisor'
        static_configs:
            -   targets: [ 'cadvisor:8080' ]

    - job_name: 'prometheus'
      static_configs:
          - targets: ['prometheus:9090']

    -   job_name: 'jaeger'
        static_configs:
            -   targets: ['jaeger:16686']

    -   job_name: 'loki'
        static_configs:
            -   targets: [ 'loki:3100' ]

    -   job_name: 'otel-collector'
        static_configs:
            -   targets: ['otel-collector:8888']

    -   job_name: 'keycloak'
        metrics_path: '/metrics'
        static_configs:
            -   targets: ['keycloak:8080']

    - job_name: 'gateway'
      metrics_path: '/actuator/prometheus'
      static_configs:
          - targets: ['gateway:8081']

    -   job_name: 'draw-core'
        metrics_path: '/actuator/prometheus'
        static_configs:
            -   targets: ['draw-core:8082']

    -   job_name: 'notify-worker'
        metrics_path: '/actuator/prometheus'
        static_configs:
            -   targets: ['notify-worker:8083']