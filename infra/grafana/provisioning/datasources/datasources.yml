apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      uid: prometheus

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      uid: loki
      jsonData:
          maxLines: 1000
          derivedFields:
              - datasourceUid: jaeger
                matcherRegex: "trace_id=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger:16686
      editable: false
      uid: jaeger