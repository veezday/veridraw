extensions:
    health_check:
        endpoint: 0.0.0.0:13133

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

    postgresql:
        endpoint: "postgres:5432"
        username: veridraw
        password: veridraw_password
        tls:
            insecure: true

    redis:
        endpoint: "redis:6379"

    kafka:
        brokers: ["kafka:9092"]
        protocol_version: 2.0.0

    prometheus:
        config:
            scrape_configs:
                - job_name: 'keycloak'
                  scrape_interval: 10s
                  static_configs: [{targets: ['keycloak:8080']}]
                  metrics_path: '/metrics'
                  metric_relabel_configs:
                      -   source_labels: [ __name__ ]
                          regex: '(jvm|process)_.*'
                          action: drop

                - job_name: 'gateway'
                  scrape_interval: 10s
                  static_configs: [ { targets: [ 'gateway:8081' ] } ]
                  metrics_path: '/actuator/prometheus'
                  metric_relabel_configs:
                    - source_labels: [ __name__ ]
                      regex: '(jvm|process|system|tomcat|hikaricp|executor|spring)_.*'
                      action: drop

                - job_name: 'draw-core'
                  scrape_interval: 10s
                  static_configs: [ { targets: [ 'draw-core:8082' ] } ]
                  metrics_path: '/actuator/prometheus'
                  metric_relabel_configs:
                      - source_labels: [ __name__ ]
                        regex: '(jvm|process|system|tomcat|hikaricp|executor|spring)_.*'
                        action: drop

                - job_name: 'notify-worker'
                  scrape_interval: 10s
                  static_configs: [ { targets: [ 'notify-worker:8083' ] } ]
                  metrics_path: '/actuator/prometheus'
                  metric_relabel_configs:
                      - source_labels: [ __name__ ]
                        regex: '(jvm|process|system|tomcat|hikaricp|executor|spring)_.*'
                        action: drop

processors:
    batch:
        timeout: 1s
        send_batch_size: 1024

exporters:
    prometheus:
        endpoint: 0.0.0.0:8889
        namespace: veridraw

    otlp/jaeger:
        endpoint: jaeger:4317
        tls:
            insecure: true

service:
    extensions: [health_check]
    pipelines:
        metrics:
            receivers: [otlp, postgresql, redis, kafka, prometheus]
            processors: [batch]
            exporters: [prometheus]

        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp/jaeger]
