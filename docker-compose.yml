# docker-compose.yml

name: veridraw

services:
    # ==================== APPLICATION SERVICES ====================
    gateway:
        build:
            context: .
            dockerfile: gateway/Dockerfile
        container_name: veridraw-gateway
        ports:
            - "8081:8081"
        environment:
            JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            SPRING_OUTPUT_ANSI_ENABLED: ALWAYS

            # Security
            ISSUER_URI: http://keycloak:8080/realms/veridraw/protocol/openid-connect/certs

            # Redis
            REDIS_HOST: redis
            REDIS_PORT: 6379

            # Downstream services
            DRAW_CORE_URI: http://draw-core:8082
            NOTIFY_WORKER_URI: http://notify-worker:8083

            # OpenTelemetry
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_SERVICE_NAME: gateway
            OTEL_METRICS_EXPORTER: otlp
            OTEL_TRACES_EXPORTER: otlp
            OTEL_LOGS_EXPORTER: none
            OTEL_TRACES_SAMPLER: always_on
            OTEL_PROPAGATORS: tracecontext,baggage
        depends_on:
            keycloak:
                condition: service_healthy
            redis:
                condition: service_healthy
            draw-core:
                condition: service_started
            notify-worker:
                condition: service_started
            otel-collector:
                condition: service_started
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        volumes:
            - gateway-logs:/app/logs

    draw-core:
        build:
            context: .
            dockerfile: draw-core/Dockerfile
        container_name: veridraw-draw-core
        ports:
            - "8082:8082"
        environment:
            JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            SPRING_OUTPUT_ANSI_ENABLED: ALWAYS

            # External API (random.org)
            VERIDRAW_RANDOM_API_KEY: ""
            VERIDRAW_RANDOM_BASE_URL: https://api.random.org
            VERIDRAW_RANDOM_USE_EXTERNAL_API: false

            # Database
            DATABASE_URI: postgres:5432/draw_core
            DATABASE_USERNAME: veridraw
            DATABASE_PASSWORD: veridraw_password

            # Kafka
            KAFKA_URI: kafka:9092

            # Security
            ISSUER_URI: http://keycloak:8080/realms/veridraw/protocol/openid-connect/certs

            # OpenTelemetry
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_SERVICE_NAME: draw-core
            OTEL_METRICS_EXPORTER: otlp
            OTEL_TRACES_EXPORTER: otlp
            OTEL_LOGS_EXPORTER: none
            OTEL_TRACES_SAMPLER: always_on
            OTEL_PROPAGATORS: tracecontext,baggage
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
            keycloak:
                condition: service_healthy
            otel-collector:
                condition: service_started
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        volumes:
            - draw-core-logs:/app/logs

    notify-worker:
        build:
            context: .
            dockerfile: notify-worker/Dockerfile
        container_name: veridraw-notify-worker
        ports:
            - "8083:8083"
        environment:
            JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            SPRING_OUTPUT_ANSI_ENABLED: ALWAYS

            # Security
            ISSUER_URI: http://keycloak:8080/realms/veridraw/protocol/openid-connect/certs

            # Database
            DATABASE_URI: postgres:5432/notify_worker
            DATABASE_USERNAME: veridraw
            DATABASE_PASSWORD: veridraw_password

            # Kafka
            KAFKA_URI: kafka:9092
            KAFKA_CONSUMER_GROUP: notify-worker-group

            # MailHog
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
            MAIL_USERNAME:
            MAIL_PASSWORD:

            # OpenTelemetry
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_SERVICE_NAME: notify-worker
            OTEL_METRICS_EXPORTER: otlp
            OTEL_TRACES_EXPORTER: otlp
            OTEL_LOGS_EXPORTER: none
            OTEL_TRACES_SAMPLER: always_on
            OTEL_PROPAGATORS: tracecontext,baggage
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
            keycloak:
                condition: service_healthy
            otel-collector:
                condition: service_started
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 60s
        volumes:
            - notify-worker-logs:/app/logs

    # ==================== INFRASTRUCTURE ====================

    postgres:
        image: postgres:16-alpine
        container_name: veridraw-postgres
        environment:
            POSTGRES_USER: veridraw
            POSTGRES_PASSWORD: veridraw_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/postgres/create-dbs.sh:/docker-entrypoint-initdb.d/10-create-dbs.sh:ro

        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U veridraw -d draw_core && pg_isready -U veridraw -d notify_worker" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: veridraw-redis
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    kafka:
        image: apache/kafka:3.7.0
        container_name: veridraw-kafka
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        ports:
            - "9092:9092"
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092' && exit 0 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    keycloak:
        image: quay.io/keycloak/keycloak:24.0
        container_name: veridraw-keycloak
        command: start-dev --import-realm --metrics-enabled=true
        environment:
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KC_HEALTH_ENABLED: true
            KC_METRICS_ENABLED: true
            KC_METRICS_PROMETHEUS_ENABLED: true
            KC_HTTP_ENABLED: true
            #KC_HOSTNAME: keycloak:8080
            KC_HOSTNAME_STRICT: false
            KC_HOSTNAME_STRICT_HTTPS: false
            #KC_PROXY: edge
        ports:
            - "8080:8080"
        volumes:
            - ./infra/keycloak/veridraw-realm.json:/opt/keycloak/data/import/veridraw-realm.json:ro
        healthcheck:
            test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exit 0 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: veridraw-mailhog
        ports:
            - "1025:1025"  # SMTP
            - "8025:8025"  # Web UI

    # ==================== OBSERVABILITY ====================

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.110.0
        container_name: veridraw-otel
        command: ["--config=/etc/otel-collector.yaml"]
        volumes:
            - ./infra/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
        ports:
            - "4317:4317"   # OTLP gRPC
            - "4318:4318"   # OTLP HTTP
            - "8888:8888"   # Metrics endpoint
        depends_on:
            kafka:
                condition: service_healthy
            postgres:
                condition: service_healthy

    prometheus:
        image: prom/prometheus:v2.52.0
        container_name: veridraw-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--enable-feature=remote-write-receiver'

    jaeger:
        image: jaegertracing/all-in-one:1.53
        container_name: veridraw-jaeger
        ports:
            - "16686:16686" # Web UI
            - "14250:14250" # OTLP gRPC

    loki:
        image: grafana/loki:2.9.3
        container_name: veridraw-loki
        ports:
            - "3100:3100"
        volumes:
            - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki
        command: -config.file=/etc/loki/local-config.yaml

    promtail:
        image: grafana/promtail:2.9.3
        container_name: veridraw-promtail
        volumes:
            - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            loki:
                condition: service_started

    grafana:
        image: grafana/grafana:10.4.3
        container_name: veridraw-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: false
        volumes:
            - grafana_data:/var/lib/grafana
            - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
        depends_on:
            prometheus:
                condition: service_started
            jaeger:
                condition: service_started
            loki:
                condition: service_started

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: veridraw-cadvisor
        privileged: true
        devices:
            - /dev/kmsg:/dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
        ports:
            - "8085:8080"

    # ==================== LOAD TEST ====================
    k6:
        image: grafana/k6:latest
        container_name: veridraw-k6
        environment:
            - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
        volumes:
            - ./infra/k6:/scripts:ro

volumes:
    gateway-logs:
    draw-core-logs:
    notify-worker-logs:
    postgres_data:
    redis_data:
    kafka_data:
    prometheus_data:
    grafana_data:
    loki_data:
    jaeger_data: