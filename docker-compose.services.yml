# docker-compose.services.yml
# Application services (Gateway, Draw Core, Notify Worker)
# Запуск: docker compose -f docker-compose.services.yml up -d

name: veridraw-services

services:
    gateway:
        build:
            context: .
            dockerfile: gateway/Dockerfile
        container_name: veridraw-gateway
        ports:
            - "8081:8081"
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
            SPRING_OUTPUT_ANSI_ENABLED: ALWAYS

            # Keycloak
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/veridraw
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/veridraw/protocol/openid-connect/certs

            # Redis (rate limiting)
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379

            # Downstream services
            DRAW_CORE_URL: http://draw-core:8082
            NOTIFY_WORKER_URL: http://notify-worker:8083

            # OpenTelemetry
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_SERVICE_NAME: gateway

            # JVM settings
            JAVA_OPTS: "-Xms256m -Xmx512m"
        depends_on:
            keycloak:
                condition: service_healthy
            redis:
                condition: service_healthy
            otel-collector:
                condition: service_started
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        networks:
            - veridraw-net
        restart: unless-stopped
        volumes:
            - gateway-logs:/app/logs

