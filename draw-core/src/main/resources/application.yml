server:
    port: 8082

veridraw:
    random:
        api-key: ${VERIDRAW_RANDOM_API_KEY:-}
        base-url: ${VERIDRAW_RANDOM_BASE_URL:-}
        use-external-api: ${VERIDRAW_RANDOM_USE_EXTERNAL_API:false}

spring:
    application:
        name: draw-core

    r2dbc:
        url: r2dbc:postgresql://${DATABASE_URI:localhost:5432/draw_core}
        username: ${DATABASE_USERNAME:veridraw}
        password: ${DATABASE_PASSWORD:veridraw_password}

    flyway:
        enabled: true
        url: jdbc:postgresql://${DATABASE_URI:localhost:5432/draw_core}
        user: ${DATABASE_USERNAME:veridraw}
        password: ${DATABASE_PASSWORD:veridraw_password}
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_URI:localhost:9092}
        producer:
            key-serializer: org.springframework.kafka.support.serializer.ToStringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            retries: 3
        properties:
            spring.json.value.default.type: io.veridraw.shared.event.DomainEvent
            spring.json.trusted.packages: "io.veridraw.shared.event.*"

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${ISSUER_URI:http://localhost:8080/realms/veridraw/protocol/openid-connect/certs}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                http:
                    server:
                        requests: true
                drawcore:
                    random:
                        org:
                            request:
                                duration: true
                    outbox:
                        publish:
                            duration: true
        export:
            prometheus:
                enabled: true

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n"
