server:
    port: 8081

rate-limiter:
    ip:
        replenish-rate: 20  # request/sec
        burst-capacity: 40  # burst request

spring:
    application:
        name: gateway

    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        - id: draw-core
                          uri: ${DRAW_CORE_URI:http://draw-core:8082}
                          predicates:
                            - Path=/api/draws,/api/draws/**,/api/tickets,/api/tickets/**
                          filters:
                            - StripPrefix=0
                            - name: CircuitBreaker
                              args:
                                name: drawCoreCircuitBreaker
                                fallbackUri: forward:/fallback/draw-core

                            - name: RequestRateLimiter
                              args:
                                 redis-rate-limiter.replenishRate: 5
                                 redis-rate-limiter.burstCapacity: 10
                                 key-resolver: "#{@userKeyResolver}"

                        - id: notify-worker
                          uri: ${NOTIFY_WORKER_URI:http://notify-worker:8083}
                          predicates:
                            - Path=/api/inbox/**
                          filters:
                            - StripPrefix=0
                            - name: CircuitBreaker
                              args:
                                name: notifyWorkerCircuitBreaker
                                fallbackUri: forward:/fallback/notify-worker

                            - name: RequestRateLimiter
                              args:
                                redis-rate-limiter.replenishRate: 5
                                redis-rate-limiter.burstCapacity: 10
                                key-resolver: "#{@userKeyResolver}"

                    discovery:
                        locator:
                            enabled: false
                            lower-case-service-id: true


                    x-forwarded:
                        enabled: true
                        for-enabled: true
                        proto-enabled: true
                        host-enabled: true
                        port-enabled: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${ISSUER-URI:http://localhost:8080/realms/veridraw/protocol/openid-connect/certs}

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics,gateway
    endpoint:
        health:
            show-details: always
        gateway:
            enabled: true
    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                http:
                    server:
                        requests: true
                spring:
                    cloud:
                        gateway:
                            requests: true
        export:
            prometheus:
                enabled: true

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n"