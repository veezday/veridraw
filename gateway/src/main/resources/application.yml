server:
    port: 8081

spring:
    application:
        name: gateway

    # Cloud gateway
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: false # Не используем service discovery для простоты

            default-filters:
                # Add request ID for tracing
                - name: RequestRateLimiter
                  args:
                      redis-rate-limiter.replenishRate: 10  # 10 request/sec
                      redis-rate-limiter.burstCapacity: 20  # Max 20 request
                      key-resolver: "#{@ipKeyResolver}"

                # Add CORS headers
                - AddResponseHeader=X-Request-Id, ${random.uuid}

            routes:
                - id: draw-core
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/draws/**, /api/tickets/**
                  filters:
                      - StripPrefix=0
                      - name: CircuitBreaker
                        args:
                            name: drawCoreCircuitBreaker
                            fallbackUri: forward:/fallback/draw-core

                - id: notify-worker
                  uri: http://localhost:8083
                  predicates:
                      - Path=/api/notifications/**
                  filters:
                      - StripPrefix=0

    # Security OAuth2
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/veridraw
                    jwk-set-uri: http://localhost:8080/realms/veridraw/protocol/openid-connect/certs

    # Redis rate limiting
    data:
        redis:
            host: localhost
            port: 6379

# Actuator endpoints
management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics,gateway
    endpoint:
        health:
            show-details: always
        gateway:
            enabled: true
    prometheus:
        metrics:
            export:
                enabled: true

# OpenTelemetry
otel:
    service:
        name: gateway
    exporter:
        otlp:
            endpoint: http://localhost:4318
            protocol: http/protobuf
    logs:
        exporter:
            otlp:
                enabled: true

# Logging
logging:
    level:
        root: INFO
        io.veridraw: DEBUG
        org.springframework.cloud.gateway: DEBUG
        org.springframework.security: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"