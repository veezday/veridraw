# docker-compose.infra.yml
# Инфраструктурные сервисы для VeriDraw
# Запуск: docker compose -f docker-compose.infra.yml up -d

name: veridraw-infra

services:
    postgres:
        image: postgres:16-alpine
        container_name: veridraw-postgres
        environment:
            POSTGRES_DB: veridraw
            POSTGRES_USER: veridraw
            POSTGRES_PASSWORD: veridraw_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U veridraw -d veridraw"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - veridraw-net

    redis:
        image: redis:7-alpine
        container_name: veridraw-redis
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - veridraw-net

    kafka:
        image: apache/kafka:3.7.0
        container_name: veridraw-kafka
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        ports:
            - "9092:9092"
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092' && exit 0 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - veridraw-net

    keycloak:
        image: quay.io/keycloak/keycloak:24.0
        container_name: veridraw-keycloak
        command: start-dev --import-realm
        environment:
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KC_HEALTH_ENABLED: true
            KC_METRICS_ENABLED: true
            KC_METRICS_PROMETHEUS_ENABLED: true
            KC_HTTP_ENABLED: true
            KC_HOSTNAME: keycloak:8080
            KC_HOSTNAME_STRICT: false
            KC_PROXY: edge
        ports:
            - "8080:8080"
        volumes:
            - ./infra/keycloak/veridraw-realm.json:/opt/keycloak/data/import/veridraw-realm.json:ro
        networks:
            - veridraw-net
        healthcheck:
            test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exit 0 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.110.0
        container_name: veridraw-otel
        command: ["--config=/etc/otel-collector.yaml"]
        volumes:
            - ./infra/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
        ports:
            - "4317:4317"   # OTLP gRPC
            - "4318:4318"   # OTLP HTTP
            - "8888:8888"   # Metrics endpoint
        networks:
            - veridraw-net

    prometheus:
        image: prom/prometheus:v2.52.0
        container_name: veridraw-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=200h'
            - '--web.enable-lifecycle'
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - veridraw-net

    grafana:
        image: grafana/grafana:10.4.3
        container_name: veridraw-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: false
        volumes:
            - grafana_data:/var/lib/grafana
            - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - veridraw-net
        depends_on:
            - prometheus

    jaeger:
        image: jaegertracing/all-in-one:1.53
        container_name: veridraw-jaeger
        ports:
            - "16686:16686" # Web UI
            - "14250:14250" # OTLP gRPC
        environment:
            COLLECTOR_OTLP_ENABLED: true
            METRICS_PROMETHEUS_ENABLED: true
            METRICS_BACKEND: prometheus
        healthcheck:
            test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - veridraw-net

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: veridraw-mailhog
        ports:
            - "1025:1025"  # SMTP
            - "8025:8025"  # Web UI
        networks:
            - veridraw-net

    loki:
        image: grafana/loki:2.9.3
        container_name: veridraw-loki
        ports:
            - "3100:3100"
        volumes:
            - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        networks:
            - veridraw-net
        depends_on:
            - grafana

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: veridraw-cadvisor
        restart: always
        privileged: true
        devices:
            - /dev/kmsg:/dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
        ports:
            - "8085:8080"
        networks:
            - veridraw-net

    promtail:
        image: grafana/promtail:2.9.3
        container_name: veridraw-promtail
        volumes:
            - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
        command: -config.file=/etc/promtail/config.yml
        networks:
            - veridraw-net
        depends_on:
            - loki

networks:
    veridraw-net:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
    kafka_data:
    prometheus_data:
    grafana_data:
    loki_data:
    jaeger_data: