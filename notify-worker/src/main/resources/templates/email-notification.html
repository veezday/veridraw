<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Уведомление VeriDraw</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; border-radius: 8px 8px 0 0; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>VeriDraw Notification</h2>
    </div>
    <p>Здравствуйте, <strong th:text="${name}">User</strong>!</p>
    <p th:text="${message}">Текст сообщения</p>

    <div class="footer">
        <p>Это автоматическое сообщение, пожалуйста, не отвечайте на него.</p>
        <p>&copy; 2026 VeriDraw Team</p>
    </div>
</div>
</body>
</html>
