server:
    port: 8083

spring:
    application:
        name: notify-worker

    threads:
        virtual:
            enabled: true

    datasource:
        url: jdbc:postgresql://${DATABASE_URI:localhost:5432/notify_worker}
        username: ${DATABASE_USERNAME:veridraw}
        password: ${DATABASE_PASSWORD:veridraw_password}
        driver-class-name: org.postgresql.Driver

    flyway:
        enabled: true
        url: jdbc:postgresql://${DATABASE_URI:localhost:5432/notify_worker}
        user: ${DATABASE_USERNAME:veridraw}
        password: ${DATABASE_PASSWORD:veridraw_password}
        locations: classpath:db/migration

    kafka:
        listener:
            fetch-max-wait: 500
            ack-mode: manual-immediate
        bootstrap-servers: ${KAFKA_URI:kafka:9092}
        consumer:
            group-id: ${KAFKA_CONSUMER_GROUP:notify-worker-group}
            max-poll-records: 100
            fetch-min-size: 1024
            auto-offset-reset: earliest
            enable-auto-commit: false
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
            spring.json.value.default.type: io.veridraw.shared.event.DomainEvent
            spring.json.trusted.packages: "io.veridraw.shared.event.*"

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${ISSUER_URI:http://localhost:8080/realms/veridraw/protocol/openid-connect/certs}


    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: false
                    starttls:
                        enable: false
    resilience4j:
        retry:
            instances:
                emailSendRetry:
                    maxAttempts: 3
                    waitDuration: 2s
                    enableExponentialBackoff: true
                    exponentialBackoffMultiplier: 2
                    retryExceptions:
                        - org.springframework.mail.MailSendException
                        - java.net.ConnectException

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                http:
                    server:
                        requests: true
                notify_worker:
                    email:
                        send:
                            duration: true
                    kafka:
                        processing:
                            duration: true
        export:
            prometheus:
                enabled: true

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n"
